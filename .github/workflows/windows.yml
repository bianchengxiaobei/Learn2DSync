name: windows

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      VCPKG_ROOT: C:\vcpkg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset vs2022

      - name: Build Debug
        run: cmake --build --preset debug --parallel

      - name: Test Debug
        run: ctest --preset debug --output-on-failure

      - name: Build Release
        run: cmake --build --preset release --parallel

      - name: Test Release
        run: ctest --preset release --output-on-failure

      - name: Package Windows x64
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/package_windows.ps1 -NoBuild

      - name: Package binary smoke
        shell: powershell
        run: |
          $zip = (Get-ChildItem dist\nsync-*-win64.zip | Select-Object -First 1).FullName
          $install = Join-Path $env:RUNNER_TEMP "nsync-package-smoke"
          Expand-Archive -LiteralPath $zip -DestinationPath $install -Force
          $root = Get-ChildItem $install -Directory | Select-Object -First 1
          if ($null -eq $root -or
              -not (Test-Path (Join-Path $root.FullName "PACKAGE_MANIFEST.txt"))) {
              throw "package manifest missing"
          }
          & (Join-Path $root.FullName "nsync_client.exe") --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "packaged client --help failed" }
          & (Join-Path $root.FullName "nsync_server.exe") --ticks 5 --log-level warn
          if ($LASTEXITCODE -ne 0) { throw "packaged server smoke failed" }

      - name: Server deployment smoke
        shell: powershell
        run: |
          $zip = (Get-ChildItem dist\nsync-*-win64.zip | Select-Object -First 1).FullName
          $install = Join-Path $env:RUNNER_TEMP "nsync-server-smoke"
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\deploy_server.ps1 -PackageZip $zip -InstallDir $install -Port 40202 -Players 10 -Install -Start
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\deploy_server.ps1 -InstallDir $install -Status
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\deploy_server.ps1 -InstallDir $install -Stop

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: nsync-win64
          path: dist/nsync-*-win64.zip*
